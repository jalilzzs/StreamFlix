<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================
       Basic SEO
  ========================== -->

  <title>StreamFlix — Movies & TV Shows</title>

  <meta
    name="description"
    content="StreamFlix — Discover and watch movies and TV shows in one place."
  />

  <meta name="theme-color" content="#0b0b0f" />

  <!-- =========================
       Open Graph / Social Preview
  ========================== -->

  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="StreamFlix — Movies & TV Shows"
  />

  <meta
    property="og:description"
    content="Discover and watch movies and TV shows on StreamFlix."
  />

  <meta
    property="og:image"
    content="/streamflix-preview.jpg"
  />

  <meta
    property="og:image:alt"
    content="StreamFlix — Movies & TV Shows"
  />

  <meta property="og:site_name" content="StreamFlix" />

  <!--
    Change this to your real website URL
    when your final domain is ready.
  -->
  <meta
    property="og:url"
    content="https://YOUR-DOMAIN.com/"
  />

  <!-- =========================
       Twitter / X Preview
  ========================== -->

  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="StreamFlix — Movies & TV Shows"
  />

  <meta
    name="twitter:description"
    content="Discover and watch movies and TV shows on StreamFlix."
  />

  <meta
    name="twitter:image"
    content="/streamflix-preview.jpg"
  />

  <!-- =========================
       Fonts
  ========================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- =========================
       Player
  ========================== -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
  />
</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>
</body>
</html>
